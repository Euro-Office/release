name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v, e.g. 9.3.6 or 9.3.6-rc.1'
        required: true
        type: string
      products:
        description: 'Products to release'
        type: choice
        options: [both, ds, de]
        default: both
      dry_run:
        description: 'Only print the tags that would be created'
        type: boolean
        default: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag submodules and products
        env:
          GH_TOKEN: ${{ secrets.EO_ROBOT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRODUCTS: ${{ inputs.products }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--products "$PRODUCTS")
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          ./release.sh tag "$VERSION" "${args[@]}"
