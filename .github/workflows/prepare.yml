name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v, e.g. 9.3.6 or 9.3.6-rc.1'
        required: true
        type: string
      products:
        description: 'Products to release'
        type: choice
        options: [both, ds, de]
        default: both
      since:
        description: 'Previous tag to build the changelog from (default: latest release tag)'
        required: false
        type: string
      dry_run:
        description: 'Only print the release commit and changelog'
        type: boolean
        default: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release PRs
        env:
          GH_TOKEN: ${{ secrets.EO_ROBOT_GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRODUCTS: ${{ inputs.products }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh auth setup-git
          read -r login id < <(gh api user --jq '.login + " " + (.id | tostring)')
          git config --global user.name "$login"
          git config --global user.email "$id+$login@users.noreply.github.com"
          args=(--products "$PRODUCTS")
          [ -z "$SINCE" ] || args+=(--since "$SINCE")
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          ./release.sh prepare "$VERSION" "${args[@]}"
